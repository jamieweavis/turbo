[package]
name = "turbo"
edition.workspace = true
version.workspace = true
publish.workspace = true

# The Rust core. The Swift shell links it as libturbo_core.a.
[lib]
name = "turbo_core"
crate-type = ["lib", "staticlib"]

[dependencies]
uniffi.workspace = true
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSBitmapImageRep", "NSEvent", "NSImageRep", "NSPasteboard", "NSPasteboardItem", "NSRunningApplication", "NSScreen", "NSWorkspace", "block2", "libc", "objc2-core-graphics"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSArray", "NSData", "NSDate", "NSDateFormatter", "NSDictionary", "NSEnumerator", "NSError", "NSFileManager", "NSFormatter", "NSGeometry", "NSLocale", "NSString", "NSURL", "NSValue"] }
objc2-core-foundation = "0.3"
objc2-core-graphics = "0.3"
objc2-core-wlan = { version = "0.3", default-features = false, features = ["std", "CWInterface", "CWWiFiClient"] }
objc2-av-foundation = { version = "0.3", default-features = false, features = ["std", "AVCaptureDevice", "AVMediaFormat", "block2"] }
block2 = "0.6"
dispatch2 = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
ddc = "0.2"
ddc-macos = "0.2"
notify = { version = "8", default-features = false, features = ["macos_fsevent"] }
plist = "1"
unicode-normalization = "0.1"
unicode-segmentation = "1"
rusqlite = { version = "0.41", features = ["bundled"] }
parking_lot = "0.13"
sha2 = "0.11"
emojis = "0.8"
toml = "1.1.8"
log = "0.4"
oslog = { version = "0.2", default-features = false }

[workspace]
resolver = "3"
members = ["tools/uniffi-bindgen"]

[workspace.package]
edition = "2024"
version = "0.1.8"
publish = false

[workspace.dependencies]
uniffi = "0.32"

[profile.release]
lto = "thin"
codegen-units = 1
