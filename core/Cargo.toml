[package]
name = "jaycast-core"
edition.workspace = true
version.workspace = true
publish.workspace = true

[lib]
name = "jaycast_core"
crate-type = ["lib", "staticlib"]

[dependencies]
uniffi.workspace = true
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSEvent", "NSPasteboard", "NSRunningApplication", "NSWorkspace", "block2", "objc2-core-graphics"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSArray", "NSData", "NSError", "NSFileManager", "NSLocale", "NSString", "NSURL"] }
objc2-core-foundation = "0.3"
objc2-core-graphics = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
ddc = "0.2"
ddc-macos = "0.2"
notify = { version = "8", default-features = false, features = ["macos_fsevent"] }
plist = "1"
unicode-normalization = "0.1"
